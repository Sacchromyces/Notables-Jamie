<style>
body {
    font-family: sans-serif;
    background: #ffffff; /* solid white */
    color: #000;          /* change text color to black for contrast */
    text-align: center;
    margin: 0;
    padding: 20px;
}
/* Header with circular logo */
#mainHeader {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin-bottom: 20px;
}
#mainHeader img#logo {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
}
#mainHeader h1 {
    margin: 0;
    font-size: 28px;
    font-weight: bold;
}
    
#albums {
    display: flex;         /* horizontal row */
    flex-wrap: wrap;       /* wrap to next line if needed */
    justify-content: center; /* center the row */
    gap: 25px;
    margin-bottom: 20px;
    padding: 0 20px;
}

.album, .home-square {
    width: 200px;
    flex: 0 0 200px;         /* fixed width */
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}

.album img, .home-square img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid #555;
    margin-bottom: 5px;
    transition: transform 0.2s;
}

.album img:hover, .home-square img:hover {
    transform: scale(1.05);
}

.album-title {
    font-weight: bold;
    margin-bottom: 5px;
}
    
 #homeWrapper {
    display: flex;
    justify-content: center; /* center the home button */
    margin-bottom: 15px;
}
    .album-row {
    display: flex;
    overflow-x: visible;
    flex-direction: row;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
   }
 @media (min-width: 1024px) {
  .album-row {
    flex-wrap: wrap; 
  }  
}

#playerArea {
    margin-top: 20px;  /* enough space below album title */
    padding-bottom: 0;
}
#playlist button {
    margin: 5px;
    padding: 10px 15px;
    background: #f5f5f5;
    border: 1px solid #555;
    color: #000;
    cursor: pointer;
    border-radius: 5px;
    display: block;
    width: 220px;
    margin-left:auto;
    margin-right:auto;
    transition: background 0.2s, filter 0.2s;
}
#playlist button:hover {
    background: #e0e0e0;
}
#playlist button.playing {
    background: #d0d0d0;
    color: #000;
    filter: brightness(0.8);
}

#nowPlaying { margin: 10px 0; font-weight: bold; }
audio {
    margin-top: 15px;
    width: 95%;
    max-width: 1000px;
    outline: none;
    background: transparent; /* removes black background */
    color: #000; /* black text for white background */
}

#controls {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
    align-items:center;
}
.control-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: none;
    background: #444;
    color: #fff;
    font-size: 20px;
    display:flex; justify-content:center; align-items:center;
    cursor:pointer;
    transition: transform 0.2s, filter 0.2s;
}
.control-btn:hover { transform: scale(1.1); filter: brightness(1.2); }
.control-btn.active { background:#666; filter:brightness(1.3); }
#play { width: 60px; height: 60px; font-size: 28px; }



/* --- Desktop only: make player background seamless --- */
@media (min-width: 481px) {
  #desktopQuote {
    position: relative;   /* let it flow naturally below content */
    bottom: auto;
    left: auto;
    transform: none;
    margin-top: 10px;     /* spacing above quote */
    min-height: auto; /* let content height shrink naturally */
    font-size: 12px;
    color: #000;
    text-align: center;
    line-height: 1.4;
  }
  #nowPlaying {
    margin: 10px 0 5px 0; /* top 10px, right 0, bottom 0px, left 0 */
  }
    body.playlist-open #nowPlaying {
    margin-top: 10px; /* lower when a playlist is open */
  }
  #playerArea {
    margin-top: -10px; /* optional: reduce extra top spacing */
    padding-bottom: 10px; /* optional: reduce extra bottom spacing */
  }
 body {
    display: flex;
    flex-direction: column;
    min-height: auto; /* let content size itself naturally */
  }
}

    
/* --- Mobile styles (max-width 480px) --- */
@media (max-width: 480px) {
  body {
    padding: 15px;
    font-size: 16px;
    padding-bottom: 180px;
  }

  #mainHeader img#logo { 
    width: 30px; 
    height: 30px;

  #play {

  }

    display: block;

    position: relative;
    z-index: 2;
  }
    
/* --- Mobile styles (max-width 480px) --- */
#nowPlaying {
    margin-top: -15px; /* move it higher above album title */

body.playlist-open #nowPlaying {
    margin-top: 20px; /* keep a proper gap when playlist is open */

    position: fixed;
    left: 0;
    width: 100%;
    background: #111;
    padding: 5px 0 10px 0; /* top 5px, bottom 10px */

    z-index: 9999;
    transition: all 0.3s ease;
  }

  #mobilePlayer.docked { 
    position: absolute; 
    box-shadow: none; 
  }

  #albumTitle, #playlist { 
    margin-bottom: 20px; 
  }

    font-size: 18px;

  .home-square img {
    display: none;
  }

  #homeWrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 0;
  }

  .home-square:hover { 
    background: #333; 
  }
/* Fix first song overlapping album title */
#albumTitle {
    display: block;
    margin: 30px 0 15px 0; /* top 30px, bottom 15px */
    position: relative;
    z-index: 2;
}

#playlist button {
    margin-top: 10px; /* space from album title */
 }
}

let currentAlbum = null;
let currentSong = null;
let lastAlbum = null;
let shuffle = false;
let repeat = false;

const player = document.getElementById("player");
const source = document.getElementById("source");
const nowPlaying = document.getElementById("nowPlaying");
const albumTitle = document.getElementById("albumTitle");
const albumsDiv = document.getElementById("albums");
const playlistDiv = document.getElementById("playlist");
const playBtn = document.getElementById("play");
const shuffleBtn = document.getElementById("shuffle");
const repeatBtn = document.getElementById("repeat");

// Update playlist highlight — only highlight the song that is actually playing in the current playlist
function updatePlaylistButtons(){
  const buttons = [...playlistDiv.querySelectorAll("button")];
  buttons.forEach((btn, i) => {
    // Only highlight if this is the current album AND this is the current song
    const isCurrentSong = currentSong === i && currentAlbum !== null && albums[currentAlbum].songs[currentSong].file === source.src.split('/').pop();
    btn.classList.toggle("playing", isCurrentSong);
  });
}

function loadAlbum(name){
  currentAlbum = name;
  lastAlbum = name;
  
  // Set album title text
  albumTitle.textContent = name;
  
  // Ensure title is visible
  albumTitle.style.display = "block";

  playlistDiv.innerHTML = "";
  
  albums[name].songs.forEach((song,index)=>{
    const btn = document.createElement("button");
    btn.textContent = song.title;
    btn.addEventListener("click", ()=>playSong(index));
    playlistDiv.appendChild(btn);
  });

  document.body.classList.add("playlist-open");
  updatePlaylistButtons();
}



// --- Play song ---
async function playSong(index, albumName=null){
  if(albumName && albumName !== currentAlbum) loadAlbum(albumName);
  if(!currentAlbum && lastAlbum) currentAlbum = lastAlbum;
  if(!currentAlbum) return;

  const songs = albums[currentAlbum].songs;
  if(index < 0 || index >= songs.length) return;

  currentSong = index;
  const song = songs[currentSong];

  // Default to original URL
  let songUrl = song.file;

  // Try offline cache
  if ('caches' in window) {
  try {
    songUrl = song.file; // always use real URL
  } catch (e) {
    console.error('Cache fetch error:', e);
  }
}


  // Set source and play
  source.src = songUrl;
  player.load();
  player.play();
  nowPlaying.textContent = "Now Playing: " + song.title;
  updatePlaylistButtons();
  playBtn.innerHTML = "&#10074;&#10074;";

  // Media Session metadata (use original HTTPS URL, not blob)
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: currentAlbum,
      album: currentAlbum,
      artwork: [{ src: 'https://sacchromyces.github.io/Albums/' + albums[currentAlbum].cover, sizes:'200x200', type:'image/jpeg'}]
    });

    navigator.mediaSession.setActionHandler('play',  () => { player.play(); });
    navigator.mediaSession.setActionHandler('pause', () => { player.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }
}

// --- Next/Prev ---
function nextTrack(){
  if(!currentAlbum) return;
  const songs = albums[currentAlbum].songs;
  let nextIndex;
  if(shuffle){
    do { nextIndex = Math.floor(Math.random() * songs.length); }
    while(nextIndex === currentSong && songs.length > 1);
  } else {
    nextIndex = currentSong + 1;
    if(nextIndex >= songs.length) nextIndex = 0;
  }
  playSong(nextIndex);
}

function prevTrack(){
  if(!currentAlbum) return;
  const songs = albums[currentAlbum].songs;
  let prevIndex = currentSong - 1;
  if(prevIndex < 0) prevIndex = songs.length - 1;
  playSong(prevIndex);
}

  albumDiv.className = "album";
  albumDiv.innerHTML = `<img src="${albums[name].cover}" alt="${name}"><div class="album-title">${name}</div>`;
  albumDiv.addEventListener("click", ()=>loadAlbum(name));
  albumsDiv.appendChild(albumDiv);
});

// --- Controls ---
playBtn.addEventListener("click", ()=>{
  if(player.paused){
    if(currentSong === null){
      const albumNames = Object.keys(albums);
      const randomAlbum = albumNames[Math.floor(Math.random() * albumNames.length)];
      const songIndex = Math.floor(Math.random() * albums[randomAlbum].songs.length);
      playSong(songIndex, randomAlbum);
    } else {
      player.play();
    }
    playBtn.innerHTML = "&#10074;&#10074;";
  } else {
    player.pause();
    playBtn.innerHTML = "&#9654;";
  }
});
document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("prev").addEventListener("click", prevTrack);
shuffleBtn.addEventListener("click", ()=>{ shuffle = !shuffle; shuffleBtn.classList.toggle("active", shuffle); });
repeatBtn.addEventListener("click", ()=>{ repeat = !repeat; repeatBtn.classList.toggle("active", repeat); });

player.addEventListener("pause", ()=>playBtn.innerHTML="&#9654;");
player.addEventListener("play", ()=>playBtn.innerHTML="&#10074;&#10074;");

player.addEventListener("ended", ()=>{
  if(repeat){
    playSong(currentSong);
  } else {
    nextTrack();
  }
});

// --- Mobile sticky ---
const mobilePlayer = document.getElementById("mobilePlayer");
window.addEventListener('scroll', ()=>{
  if(window.innerWidth > 480) return;
  const nowPlayingRect = nowPlaying.getBoundingClientRect();
  const scrollBottom = document.documentElement.scrollHeight - window.innerHeight - (window.pageYOffset || document.documentElement.scrollTop);
  const distanceToNowPlayingBottom = nowPlayingRect.bottom + window.scrollY;
  if(scrollBottom < 5){
    mobilePlayer.style.position = 'absolute';
    mobilePlayer.style.top = (distanceToNowPlayingBottom + 15) + 'px';
    mobilePlayer.style.bottom = 'auto';
  } else {
    mobilePlayer.style.position = 'fixed';
    mobilePlayer.style.bottom = '0';
    mobilePlayer.style.top = 'auto';
  }
});

    // Initialize play button symbol on page load
playBtn.innerHTML = "&#9654;"; // ►
    
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js")
    .then(() => console.log("Service Worker registered"))
    .catch(err => console.error("SW registration failed:", err));
}

</script>
